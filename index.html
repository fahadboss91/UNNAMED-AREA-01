<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNNAMED AREA — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --black:#0a0a0a; --cream:#f0ede6; --green:#6b7c52; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--black); color:var(--cream); font-family:'Space Mono',monospace; overflow:hidden; }
.bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.veil { position:fixed; inset:0; z-index:1; background:linear-gradient(to bottom, rgba(10,10,10,.55), rgba(10,10,10,.82)); }
.page { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px; gap:26px; overflow-y:auto; }
.logo { width:64px; opacity:.95; filter:invert(1); }
.title { font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:clamp(64px,13vw,190px); line-height:.88; letter-spacing:4px; color:transparent; -webkit-text-stroke:1.5px var(--green); }
.tag { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--green); }
.cd { display:flex; gap:clamp(14px,3vw,36px); justify-content:center; flex-wrap:wrap; }
.cd div { display:flex; flex-direction:column; min-width:70px; }
.cd b { font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:clamp(40px,6vw,72px); line-height:1; font-variant-numeric:tabular-nums; }
.cd span { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(240,237,230,.55); margin-top:6px; }
.nl { display:flex; flex-direction:column; gap:12px; width:min(420px,100%); }
.nl input[type=text], .nl input[type=email] { background:rgba(240,237,230,.06); border:1px solid rgba(240,237,230,.25); color:var(--cream); padding:15px 18px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; outline:none; width:100%; }
.nl input:focus { border-color:var(--green); }
.nl button { background:var(--cream); color:var(--black); border:none; padding:16px; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:3px; font-weight:700; text-transform:uppercase; cursor:pointer; }
.nl button:hover { background:var(--green); color:var(--cream); }
.nl label { display:flex; gap:10px; align-items:flex-start; text-align:left; font-size:9px; line-height:1.7; color:rgba(240,237,230,.6); }
.nl label a { color:var(--cream); }
.nl .ok { display:none; font-size:10px; letter-spacing:2px; color:var(--green); }
.cs-social { display:flex; gap:22px; }
.cs-social a { color:var(--cream); opacity:.85; }
.cs-social a:hover { color:var(--green); opacity:1; }
.cs-social svg { width:20px; height:20px; fill:currentColor; }
.legal { position:fixed; bottom:14px; left:0; right:0; z-index:2; display:flex; justify-content:center; gap:22px; flex-wrap:wrap; font-size:9px; letter-spacing:2px; text-transform:uppercase; }
.legal a { color:rgba(240,237,230,.5); text-decoration:none; }
.legal a:hover { color:var(--cream); }
@media(max-width:768px){
 .page { align-items:flex-start; text-align:left; padding:32px 16px 80px; }
 .cd { justify-content:flex-start; }
 .cs-social { align-self:flex-start; }
 .nl label { font-size:8px; }
}
@media (prefers-reduced-motion:reduce){ .bg { display:none; } }

.vw { position:relative; width:min(88vw,1100px); height:clamp(120px,22vw,250px); }
.vw canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.vw-fallback { display:none; position:absolute; inset:0; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:clamp(64px,13vw,190px); letter-spacing:4px; color:transparent; -webkit-text-stroke:1.5px #6b7c52; }
.vw.nogl .vw-fallback { display:flex; }
.vw.nogl canvas { display:none; }
.vw-lbl { position:absolute; left:0; top:0; font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:1px; color:#6b7c52; opacity:.8; pointer-events:none; white-space:nowrap; transform:translate(-50%,-180%); }
@media(max-width:768px){ .vw { width:100%; height:30vw; min-height:110px; } .vw-lbl { display:none; } }

@media(max-width:768px){
 .page { gap:20px; padding:28px 18px 96px; justify-content:center; }
 .logo { width:46px; }
 .vw { width:100%; height:34vw; min-height:110px; max-height:200px; }
 .tag { font-size:9px; letter-spacing:3px; }
 .cd { gap:14px; width:100%; }
 .cd div { min-width:56px; }
 .cd b { font-size:clamp(34px,10vw,46px); }
 .cd span { font-size:8px; letter-spacing:1.5px; }
 .nl { width:100%; }
 .nl input[type=text], .nl input[type=email] { padding:13px 14px; font-size:10px; }
 .nl button { padding:14px; font-size:9px; }
 .cs-social { gap:18px; }
 .legal { bottom:10px; gap:12px; font-size:8px; letter-spacing:1.5px; padding:0 10px; }
}
@media(max-width:380px){
 .cd { gap:10px; }
 .cd div { min-width:48px; }
 .cd b { font-size:32px; }
 .tag { letter-spacing:2px; }
 .legal { gap:8px; font-size:7px; }
}
</style>
</head>
